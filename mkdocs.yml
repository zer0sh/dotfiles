site_name: zer0sh Dotfiles
site_description: Official documentation for zer0sh's Hyprland, Quickshell, and terminal environment
site_author: zer0sh
site_url: https://zer0sh.github.io/dotfiles/
repo_url: https://github.com/zer0sh/dotfiles
repo_name: zer0sh/dotfiles

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list

nav:
  - Home:
      - Overview: index.md
      - Gallery: gallery.md
  - Desktop:
      - Hyprland:
          - Architecture: hyprland/index.md
          - Keybindings: hyprland/keybinds.md
          - XWayland & Window Rules: hyprland/xwayland.md
          - Shaders & Filters: hyprland/shaders.md
          - Screen Locking & Idle: hyprland/hyprlock.md
      - Quickshell:
          - Control Center: quickshell/index.md
          - Notifications & OSDs: quickshell/osd-notifications.md
          - Floating Launcher & Wallpapers: quickshell/launcher-wallpapers.md
      - Waybar: apps/waybar.md
      - Wofi: apps/wofi.md
      - Matugen: apps/matugen.md
      - Steam: apps/steam.md
      - Zen Browser: apps/zen.md
  - CLI:
      - Terminals:
          - Alacritty: terminals/alacritty.md
          - Kitty: terminals/kitty.md
          - Zsh: terminals/zsh.md
          - Vim: terminals/vim.md
      - Fastfetch: apps/fastfetch.md
      - Bat: apps/bat.md
      - Btop: apps/btop.md
  - Workflow:
      - Philosophy & Workflow: dotfiles/workflow.md
      - Release & SemVer: dotfiles/releases.md
