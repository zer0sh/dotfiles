site_name: zer0sh Dotfiles
site_description: Official documentation for zer0sh's Hyprland, Quickshell, and terminal environment
site_author: zer0sh
site_url: https://zer0sh.github.io/dotfiles/
repo_url: https://github.com/zer0sh/dotfiles
repo_name: zer0sh/dotfiles

theme:
  name: material
  language: en
  palette:
    # Default dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Hyprland:
      - Architecture: hyprland/index.md
      - Keybindings: hyprland/keybinds.md
      - Shaders & Filters: hyprland/shaders.md
  - Quickshell:
      - Control Center: quickshell/index.md
      - Notifications & OSDs: quickshell/osd-notifications.md
  - Launchers & Tools:
      - Wofi: apps/wofi.md
      - Fastfetch: apps/fastfetch.md
  - Terminals:
      - Alacritty: terminals/alacritty.md
  - Dotfiles & Workflow:
      - Philosophy & Workflow: dotfiles/workflow.md
      - Release & SemVer: dotfiles/releases.md
