# Autostart
exec-once = dunst -conf ~/.config/dunstrc
exec-once = hyprctl setcursor ComixCursors-Opaque-White 24
exec-once = waybar
exec-once = quickshell
exec-once = $HOME/.config/hypr/scripts/restore-wallpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
