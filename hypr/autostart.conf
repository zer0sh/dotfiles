# Autostart
exec-once = bash -c 'hyprctl setcursor "$([ -f "$HOME/.config/themes/current/cursor-theme" ] && cat "$HOME/.config/themes/current/cursor-theme" || echo "Bibata-Material-Classic")" 24'
exec-once = waybar
exec-once = quickshell
exec-once = $HOME/.config/hypr/scripts/restore-wallpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
