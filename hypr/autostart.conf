# Autostart
exec-once = dunst -conf ~/.config/dunstrc
exec-once = hyprctl setcursor ComixCursors-Opaque-White 24
exec-once = waybar
exec-once = quickshell
exec-once = swaybg -o eDP-1 -i ~/Pictures/walls/wallpaper_parca.jpg -m fill
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store