# Decoration configuration
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 3
    # Border colors are centralized in ~/.config/themes/current/hyprland.conf.
}

decoration {
    rounding = 12
    active_opacity = 0.88
    inactive_opacity = 0.80
    
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.15
        vibrancy_darkness = 0.0
        ignore_opacity = false
        xray = false
        popups = true
        new_optimizations = true
    }
    
    shadow {
        enabled = true
    }
}
