# Decoration configuration
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 3
    # Border colors are centralized in ~/.config/themes/current/hyprland.conf.
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.98
    
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = false
        xray = true
        popups = false
        noise = 0.0
        new_optimizations = true
    }
    
    shadow {
        enabled = false
    }
}
