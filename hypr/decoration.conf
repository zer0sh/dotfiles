# Decoration configuration
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 3
    # Border colors are centralized in ~/.config/themes/current/hyprland.conf.
}

decoration {
    rounding = 12
    active_opacity = 0.96
    inactive_opacity = 0.96
    
    blur {
        enabled = true
        size = 3
        passes = 1
        ignore_opacity = false
        xray = true
        popups = true
        new_optimizations = true
    }
    
    shadow {
        enabled = true
    }
}
