# Keybindings
$mainMod = SUPER

# Media key aliases
$volumeUp = XF86AudioRaiseVolume
$volumeDown = XF86AudioLowerVolume
$volumeMute = XF86AudioMute
$brightnessUp = XF86MonBrightnessUp
$brightnessDown = XF86MonBrightnessDown

# Open terminal
bind = $mainMod, Return, exec, alacritty

# Open file manager
bind = $mainMod, E, exec, nautilus

# Close active window
bind = $mainMod, Q, killactive

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Open app launcher
bind = $mainMod, space, exec, $menu

# Open monitor layout editor
bind = $mainMod, P, exec, nwg-displays

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshot full screen (save + clipboard)
bind = , Print, exec, $HOME/.config/hypr/scripts/screenshot

# Screenshot selected area (save + clipboard)
bind = $mainMod, S, exec, $HOME/.config/hypr/scripts/screenshot area

# OCR selected area
bind = $mainMod SHIFT, O, exec, $HOME/.config/hypr/scripts/ocr

# Toggle screen recording
bind = $mainMod ALT, R, exec, $HOME/.config/hypr/scripts/record

# Raise volume
bind = , $volumeUp, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
# Lower volume
bind = , $volumeDown, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Toggle mute
bind = , $volumeMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Increase brightness
bind = , $brightnessUp, exec, brightnessctl set +5%
# Decrease brightness
bind = , $brightnessDown, exec, brightnessctl set 5%-

# Move focus left
bind = $mainMod, left, movefocus, l
# Move focus right
bind = $mainMod, right, movefocus, r
# Move focus up
bind = $mainMod, up, movefocus, u
# Move focus down
bind = $mainMod, down, movefocus, d

# Move window left
bind = $mainMod SHIFT, left, movewindow, l
# Move window right
bind = $mainMod SHIFT, right, movewindow, r
# Move window up
bind = $mainMod SHIFT, up, movewindow, u
# Move window down
bind = $mainMod SHIFT, down, movewindow, d

# Switch to workspace 1
bind = $mainMod, 1, workspace, 1
# Switch to workspace 2
bind = $mainMod, 2, workspace, 2
# Switch to workspace 3
bind = $mainMod, 3, workspace, 3
# Switch to workspace 4
bind = $mainMod, 4, workspace, 4
# Switch to workspace 5
bind = $mainMod, 5, workspace, 5
# Switch to workspace 6
bind = $mainMod, 6, workspace, 6
# Switch to workspace 7
bind = $mainMod, 7, workspace, 7
# Switch to workspace 8
bind = $mainMod, 8, workspace, 8
# Switch to workspace 9
bind = $mainMod, 9, workspace, 9
# Switch to workspace 10
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
# Move window to workspace 2
bind = $mainMod SHIFT, 2, movetoworkspace, 2
# Move window to workspace 3
bind = $mainMod SHIFT, 3, movetoworkspace, 3
# Move window to workspace 4
bind = $mainMod SHIFT, 4, movetoworkspace, 4
# Move window to workspace 5
bind = $mainMod SHIFT, 5, movetoworkspace, 5
# Move window to workspace 6
bind = $mainMod SHIFT, 6, movetoworkspace, 6
# Move window to workspace 7
bind = $mainMod SHIFT, 7, movetoworkspace, 7
# Move window to workspace 8
bind = $mainMod SHIFT, 8, movetoworkspace, 8
# Move window to workspace 9
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# Move window to workspace 10
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Next workspace
bind = $mainMod, mouse_down, workspace, e+1
# Previous workspace
bind = $mainMod, mouse_up, workspace, e-1

# Toggle floating mode
bind = $mainMod, F, togglefloating
# Toggle fullscreen
bind = $mainMod SHIFT, space, fullscreen

# Resize window right
bind = $mainMod ALT, right, resizeactive, 10 0
# Resize window left
bind = $mainMod ALT, left, resizeactive, -10 0
# Resize window up
bind = $mainMod ALT, up, resizeactive, 0 -10
# Resize window down
bind = $mainMod ALT, down, resizeactive, 0 10

# Launch an app as root (requires the sudo-launcher script)
bind = $mainMod, X, exec, $HOME/.config/hypr/scripts/sudo-launcher

# Power off menu
bind = CTRL ALT, Delete, exec, quickshell ipc call powermenu toggle

# Wallpaper picker
bind = $mainMod, W, exec, quickshell ipc call wallpaper toggle

# Help menu
bind = , F1, exec, quickshell ipc call shortcuts toggle

# Mini music player
bind = $mainMod, M, exec, quickshell ipc call miniplayer toggle

# Screen shader controls
# Toggle screen shader
bind = $mainMod, B, exec, $HOME/.config/hypr/scripts/filter toggle
# Apply sepia shader
bind = $mainMod CTRL, 1, exec, $HOME/.config/hypr/scripts/filter sepia
# Apply black and white shader
bind = $mainMod CTRL, 2, exec, $HOME/.config/hypr/scripts/filter bw
# Apply noir shader
bind = $mainMod CTRL, 3, exec, $HOME/.config/hypr/scripts/filter noir
# Apply vintage shader
bind = $mainMod CTRL, 4, exec, $HOME/.config/hypr/scripts/filter vintage
# Apply vivid shader
bind = $mainMod CTRL, 5, exec, $HOME/.config/hypr/scripts/filter vivid
# Disable screen shader
bind = $mainMod CTRL, 0, exec, $HOME/.config/hypr/scripts/filter off

# Move window with mouse drag
bindm = $mainMod, mouse:272, movewindow
# Resize window with mouse right-click drag
bindm = $mainMod, mouse:273, resizewindow
