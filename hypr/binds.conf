# Keybindings
$mainMod = SUPER

# Open terminal
bind = $mainMod, Return, exec, kitty

# Close active window
bind = $mainMod, Q, killactive

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Open app launcher
bind = $mainMod, space, exec, wofi --show drun

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshot selected area
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Screenshoot
bind = SUPER, S, exec, quickshell ipc screencap screenshot

# Screenrecord
bind = SUPER ALT, R, exec, quickshell ipc screencap toggle-record

# Raise volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
# Lower volume
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Toggle mute
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Increase brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
# Decrease brightness
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Move focus left
bind = $mainMod, left, movefocus, l
# Move focus right
bind = $mainMod, right, movefocus, r
# Move focus up
bind = $mainMod, up, movefocus, u
# Move focus down
bind = $mainMod, down, movefocus, d

# Move window left
bind = $mainMod SHIFT, left, movewindow, l
# Move window right
bind = $mainMod SHIFT, right, movewindow, r
# Move window up
bind = $mainMod SHIFT, up, movewindow, u
# Move window down
bind = $mainMod SHIFT, down, movewindow, d

# Switch to workspace 1
bind = $mainMod, 1, workspace, 1
# Switch to workspace 2
bind = $mainMod, 2, workspace, 2
# Switch to workspace 3
bind = $mainMod, 3, workspace, 3
# Switch to workspace 4
bind = $mainMod, 4, workspace, 4
# Switch to workspace 5
bind = $mainMod, 5, workspace, 5
# Switch to workspace 6
bind = $mainMod, 6, workspace, 6
# Switch to workspace 7
bind = $mainMod, 7, workspace, 7
# Switch to workspace 8
bind = $mainMod, 8, workspace, 8
# Switch to workspace 9
bind = $mainMod, 9, workspace, 9
# Switch to workspace 10
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
# Move window to workspace 2
bind = $mainMod SHIFT, 2, movetoworkspace, 2
# Move window to workspace 3
bind = $mainMod SHIFT, 3, movetoworkspace, 3
# Move window to workspace 4
bind = $mainMod SHIFT, 4, movetoworkspace, 4
# Move window to workspace 5
bind = $mainMod SHIFT, 5, movetoworkspace, 5
# Move window to workspace 6
bind = $mainMod SHIFT, 6, movetoworkspace, 6
# Move window to workspace 7
bind = $mainMod SHIFT, 7, movetoworkspace, 7
# Move window to workspace 8
bind = $mainMod SHIFT, 8, movetoworkspace, 8
# Move window to workspace 9
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# Move window to workspace 10
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Next workspace
bind = $mainMod, mouse_down, workspace, e+1
# Previous workspace
bind = $mainMod, mouse_up, workspace, e-1

# Toggle floating mode
bind = $mainMod, F, togglefloating
# Toggle fullscreen
bind = $mainMod SHIFT, space, fullscreen

# Resize window right
bind = $mainMod ALT, right, resizeactive, 10 0
# Resize window left
bind = $mainMod ALT, left, resizeactive, -10 0
# Resize window up
bind = $mainMod ALT, up, resizeactive, 0 -10
# Resize window down
bind = $mainMod ALT, down, resizeactive, 0 10

# Power off menu
bind = CTRL ALT, Delete, exec, quickshell ipc call powermenu toggle

# Help menu
bind = , F1, exec, quickshell ipc call shortcuts toggle

# Mini music player
bind = $mainMod, M, exec, quickshell ipc call miniplayer toggle

# 1930s filters
bind = $mainMod, B, exec, $HOME/.config/hypr/scripts/filter toggle
bind = $mainMod CTRL, 1, exec, $HOME/.config/hypr/scripts/filter sepia
bind = $mainMod CTRL, 2, exec, $HOME/.config/hypr/scripts/filter bw
bind = $mainMod CTRL, 3, exec, $HOME/.config/hypr/scripts/filter noir
bind = $mainMod CTRL, 4, exec, $HOME/.config/hypr/scripts/filter vintage
bind = $mainMod CTRL, 5, exec, $HOME/.config/hypr/scripts/filter vivid
bind = $mainMod CTRL, 0, exec, $HOME/.config/hypr/scripts/filter off

# Move window with mouse drag
bindm = $mainMod, mouse:272, movewindow
# Resize window with mouse right-click drag
bindm = $mainMod, mouse:273, resizewindow
