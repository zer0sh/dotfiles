# Animations
animations {
    enabled = yes

    # Curva easeOutExpo para 60 Hz: movimiento rapido inicial y desaceleracion suave
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 2, easeOutExpo, popin 93%
    animation = windowsIn, 1, 2, easeOutExpo, popin 93%
    animation = windowsOut, 1, 1.5, easeOutExpo, popin 93%
    animation = windowsMove, 1, 2, easeOutExpo
    animation = fade, 1, 1.5, easeOutExpo
    animation = workspaces, 1, 2, easeOutExpo, slidefade 15%
}
