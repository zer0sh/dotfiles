# Animations
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.4, 0, 0.2, 1
    bezier = bounce, 0.3, 1.5, 0.3, 1

    animation = windows, 1, 3, myBezier
    animation = windowsIn, 1, 1, default
    animation = windowsOut, 1, 3, myBezier, popin 80%
    animation = windowsMove, 1, 3, smooth
    animation = fade, 1, 1, default
    animation = workspaces, 1, 4, smooth, slidefade 20%
}
