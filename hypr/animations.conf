# Animations Configuration
# Extracted from https://github.com/sh1zicus/dots-hyprland (Material 3 Expressive & Emphasized Curves)

animations {
    enabled = yes

    # -----------------------------------------------------
    # Curvas de Bézier (sh1zicus / Material 3)
    # -----------------------------------------------------
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    bezier = stall, 1, -0.1, 0.7, 0.85

    # -----------------------------------------------------
    # Ventanas (Windows) - Expressive Spatial Spring Bounce
    # -----------------------------------------------------
    animation = windowsIn, 1, 3.5, expressiveDefaultSpatial, popin 75%
    animation = windowsOut, 1, 2.2, emphasizedAccel, popin 85%
    animation = windowsMove, 1, 3.5, expressiveDefaultSpatial, slide
    animation = fadeIn, 1, 2.5, emphasizedDecel
    animation = fadeOut, 1, 2, emphasizedAccel
    animation = border, 1, 10, emphasizedDecel

    # -----------------------------------------------------
    # Capas (Layers / Waybar / Overlays)
    # -----------------------------------------------------
    animation = layersIn, 1, 3, expressiveDefaultSpatial, popin 88%
    animation = layersOut, 1, 2.2, menu_accel, popin 92%
    animation = fadeLayersIn, 1, 1.5, menu_decel
    animation = fadeLayersOut, 1, 2, stall

    # -----------------------------------------------------
    # Espacios de Trabajo (Workspaces) - Fluid Spring Glide
    # -----------------------------------------------------
    animation = workspaces, 1, 5, expressiveDefaultSpatial, slide

    # -----------------------------------------------------
    # Espacio Especial (Special Workspace)
    # -----------------------------------------------------
    animation = specialWorkspaceIn, 1, 3.2, expressiveDefaultSpatial, slidevert
    animation = specialWorkspaceOut, 1, 2, emphasizedAccel, slidevert

    # -----------------------------------------------------
    # Zoom
    # -----------------------------------------------------
    animation = zoomFactor, 1, 3, standardDecel
}
