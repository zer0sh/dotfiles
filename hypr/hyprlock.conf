source = /home/zero/.config/themes/current/hyprlock.conf
$font = Google Sans

general {
  hide_cursor = true
  fail_timeout = 1000
}

# BACKGROUND
background {
  monitor =
  path = screenshot
  blur_passes = 3
  brightness = 0.55
}

# -----------------------------------------------------
# LEFT PANEL (Pixel Stacked Clock, Date & Info Widgets)
# -----------------------------------------------------

# TIME - HOURS (Pixel Monumental Stacked)
label {
  monitor =
  text = cmd[update:1000] echo "<span font_weight='bold'>$(date +%H)</span>"
  color = $accentColorPurple
  font_size = 150
  font_family = $font
  position = -420, 135
  halign = center
  valign = center
}

# TIME - MINUTES (Pixel Monumental Stacked)
label {
  monitor =
  text = cmd[update:1000] echo "<span font_weight='bold'>$(date +%M)</span>"
  color = $textColor
  font_size = 150
  font_family = $font
  position = -420, 0
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %B %d"
  color = $textColor
  font_size = 19
  font_family = $font
  position = -420, -115
  halign = center
  valign = center
}

# CLIMA (Weather Widget)
label {
  monitor =
  text = cmd[update:900000] ~/.config/hypr/scripts/weather
  color = $textColor
  font_size = 15
  font_family = $font
  position = -420, -160
  halign = center
  valign = center
}

# NOW PLAYING (Media Widget)
label {
  monitor =
  text = cmd[update:1000] ~/.config/hypr/scripts/media
  color = $textColor
  font_size = 14
  font_family = $font
  position = -420, -200
  halign = center
  valign = center
}

# -----------------------------------------------------
# RIGHT PANEL (M3 Floating Modular Modules)
# -----------------------------------------------------

# AVATAR HALO RING (Outer Accent Ring)
shape {
  monitor =
  size = 328, 328
  color = rgba(0, 0, 0, 0)
  rounding = -1
  border_size = 2
  border_color = $accentColorAttention
  position = 420, 95
  halign = center
  valign = center
}

# USER AVATAR (Circular Profile)
image {
  monitor =
  path = /home/zero/.config/hypr/avatar.png
  size = 300
  rounding = -1
  border_size = 4
  border_color = $accentColorPurple
  position = 420, 95
  halign = center
  valign = center
}

# USER CHIP PILL (Surface Container)
shape {
  monitor =
  size = 165, 34
  color = $bgColorSecondary
  rounding = -1
  border_size = 1
  border_color = $accentColorPurple
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.4)
  position = 420, -100
  halign = center
  valign = center
}

# USER CHIP LABEL
label {
  monitor =
  text = <span font_weight='bold'>󰀉  $USER</span>
  color = $textColor
  font_size = 12
  font_family = $font
  position = 420, -100
  halign = center
  valign = center
}

# INPUT FIELD (Floating Password Pill)
input-field {
  monitor =
  size = 280, 52
  outline_thickness = 3
  dots_size = 0.22
  dots_spacing = 0.25
  dots_center = true
  outer_color = $accentColorPurple
  inner_color = $bgColorSecondary
  font_color = $textColor
  fade_on_empty = false
  placeholder_text = <span foreground="##$textColorHex"><i>󰌾 Password...</i></span>
  hide_input = false
  rounding = -1
  check_color = $accentColorPurple
  fail_color = $textColorDanger
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $accentColorAttention
  position = 420, -165
  halign = center
  valign = center
}

# STATUS CHIP PILL (Surface Container)
shape {
  monitor =
  size = 175, 34
  color = $bgColorSecondary
  rounding = -1
  border_size = 1
  border_color = $accentColorPurple
  shadow_passes = 2
  shadow_size = 6
  shadow_color = rgba(0, 0, 0, 0.4)
  position = 420, -230
  halign = center
  valign = center
}

# STATUS CHIP LABEL
label {
  monitor =
  text = <span foreground="##$accentColorPurpleHex">󰌾</span>  Protected Session
  color = $textColor
  font_size = 11
  font_family = $font
  position = 420, -230
  halign = center
  valign = center
}

# -----------------------------------------------------
# ESTADO DEL SISTEMA (Esquina superior derecha)
# -----------------------------------------------------

# SYSTEM STATUS (Network, Bluetooth, Battery - Top Right)
label {
  monitor =
  text = cmd[update:3000] ~/.config/hypr/scripts/status
  color = $textColor
  font_size = 15
  font_family = $font
  position = -40, -35
  halign = right
  valign = top
}
