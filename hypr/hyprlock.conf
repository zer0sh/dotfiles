source = /home/zero/.config/themes/current/hyprlock.conf
$font = Google Sans

general {
  hide_cursor = true
  fail_timeout = 1000
}

# USER AVATAR (Top Left - Circular Badge)
image {
  monitor =
  path = /home/zero/.config/hypr/avatar.png
  size = 32
  rounding = -1
  border_size = 2
  border_color = $accentColorPurple
  position = 30, -26
  halign = left
  valign = top
}

# SYSTEM STATUS (Network, Bluetooth, Battery - Top Right)
label {
  monitor =
  text = cmd[update:3000] ~/.config/hypr/scripts/status
  color = $textColor
  font_size = 16
  font_family = $font
  position = -30, -30
  halign = right
  valign = top
}

# TIME (Pixel Material You Clock - Hour in Accent, Minutes in Text Color)
label {
  monitor =
  text = cmd[update:1000] echo "<span font_weight='bold' foreground='##$accentColorPurpleHex'>$(date +%H)</span><span font_weight='bold' foreground='##$textColorHex'>:$(date +%M)</span>"
  color = $textColor
  font_size = 135
  font_family = $font
  position = 0, 130
  halign = center
  valign = center
}

# DATE (Subtítulo fecha)
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B"
  color = $textColor
  font_size = 22
  font_family = $font
  position = 0, 40
  halign = center
  valign = center
}

# INPUT FIELD (Contraseña)
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accentColorPurple
  inner_color = $bgColorSecondary
  font_color = $textColor
  fade_on_empty = false
  placeholder_text = <span foreground="##$textColorHex"><i>󰌾 Logged in as </i><span foreground="##$accentColorPurpleHex">$USER</span></span>
  hide_input = false
  check_color = $accentColorPurple
  fail_color = $textColorDanger
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $accentColorAttention
  position = 0, -50
  halign = center
  valign = center
}

# CLIMA (Bottom Left)
label {
  monitor =
  text = cmd[update:900000] ~/.config/hypr/scripts/weather
  color = $textColor
  font_size = 15
  font_family = $font
  position = 30, 30
  halign = left
  valign = bottom
}

# NOW PLAYING (Bottom Right)
label {
  monitor =
  text = cmd[update:1000] ~/.config/hypr/scripts/media
  color = $textColor
  font_size = 14
  font_family = $font
  position = -30, 30
  halign = right
  valign = bottom
}

# BACKGROUND
background {
  path = screenshot
  blur_passes = 2
  brightness = 0.56
}
