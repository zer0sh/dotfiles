source = /home/zero/.config/themes/current/hyprlock.conf
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
  fail_timeout = 1000
}

# TIME
label {
  text = $TIME
  color = $textColor
  font_size = 90
  font_family = $font
  position = 0, 200
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $textColor
  font_size = 25
  font_family = $font
  position = 0, 110
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accentColorPurple
  inner_color = $bgColorSecondary
  font_color = $textColor
  fade_on_empty = false
  placeholder_text = <span foreground="##$textColorHex"><i>󰌾 Logged in as </i><span foreground="##$accentColorPurpleHex">$USER</span></span>
  hide_input = false
  check_color = $accentColorPurple
  fail_color = $textColorDanger
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $accentColorAttention
  position = 0, -30
  halign = center
  valign = center
}

# BACKGROUND
background {
  path = screenshot
  blur_passes = 2
  brightness = 0.56
}
