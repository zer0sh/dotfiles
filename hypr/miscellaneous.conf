# Input configuration
input {
    kb_layout = us
    kb_variant = altgr-intl
    follow_mouse = true
    mouse_refocus = true
    sensitivity = 0
    repeat_rate = 50
    repeat_delay = 250

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Miscellaneous
misc {
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Layout configuration
dwindle {
    preserve_split = true
}
