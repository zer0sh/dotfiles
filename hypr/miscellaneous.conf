# Input configuration
input {
    kb_layout = us
    kb_variant = altgr-intl
    follow_mouse = true
    mouse_refocus = true
    sensitivity = 0
    repeat_rate = 8
    repeat_delay = 300

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# Miscellaneous
misc = {}

# Layout configuration
dwindle {
    pseudotile = true
    preserve_split = true
}
