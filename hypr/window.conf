# Window configuration
layerrule = blur on, ignore_alpha 0.5, match:namespace wofi
layerrule = blur on, ignore_alpha 0, match:namespace quickshell:.*
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class blueman-manager
windowrule = float on, match:title Picture-in-Picture
windowrule = opacity 0.92 0.86, match:class (pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Nautilus|nautilus|gnome-calculator)

# Group configuration
group = enabled
bind = $mainMod, G, togglegroup
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod SHIFT, tab, changegroupactive, b