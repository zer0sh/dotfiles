# Kitty mirrors the Alacritty setup; the color palette is generated by Matugen.
# See: ~/dotfiles/docs/terminals/kitty.md

# Dynamic palette produced by Matugen (central theme store).
include ~/.config/themes/current/kitty.conf

# Window geometry and opacity (matches Alacritty: 15x15 padding, 0.92 opacity).
window_padding_width 15
background_opacity 0.92

# Cursor (matches Alacritty: underlined shape with blinking enabled).
cursor_shape underline
cursor_blink_interval 0.5

# Typography (matches Alacritty: BlexMono Nerd Font with Bold as the normal weight).
font_family family="BlexMono Nerd Font" style="Bold"
bold_font family="BlexMono Nerd Font" style="Bold"
italic_font family="BlexMono Nerd Font" style="Bold Italic"
bold_italic_font family="BlexMono Nerd Font" style="Bold Italic"
font_size 11.0

# Prevent the shell from overriding the cursor shape set above.
shell_integration no-cursor
